<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Connect Apple Music to your car</title>
<style>
  :root { --accent: #fa2d48; --bg: #fff; --fg: #1d1d1f; --muted: #6e6e73; --card: #f5f5f7; }
  @media (prefers-color-scheme: dark) { :root { --bg: #000; --fg: #f5f5f7; --muted: #a1a1a6; --card: #1c1c1e; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
         font: 17px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
         background: var(--bg); color: var(--fg); padding: 24px 16px; }
  main { width: 100%; max-width: 420px; text-align: center; }
  .icon { width: 72px; height: 72px; border-radius: 18px; background: var(--accent); margin: 0 auto 20px;
          display: flex; align-items: center; justify-content: center; }
  h1 { font-size: 26px; margin: 0 0 8px; }
  p { color: var(--muted); margin: 0 0 24px; }
  .code { font: 600 22px/1 ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: 2px;
          background: var(--card); border-radius: 12px; padding: 14px; margin: 0 0 24px; }
  button { width: 100%; font: 600 17px/1 inherit; color: #fff; background: var(--accent); border: 0;
           border-radius: 14px; padding: 16px; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  input { width: 100%; font: 600 20px/1 ui-monospace, Menlo, monospace; text-align: center; letter-spacing: 2px;
          text-transform: uppercase; padding: 14px; border-radius: 12px; border: 1px solid var(--muted);
          background: var(--card); color: var(--fg); margin-bottom: 12px; }
  .status { margin-top: 20px; min-height: 1.5em; }
  .ok { color: #30d158; font-weight: 600; }
  .err { color: var(--accent); }
  .fine { font-size: 13px; margin-top: 32px; }
</style>
</head>
<body>
<main>
  <div class="icon" aria-hidden="true">
    <svg width="36" height="36" viewBox="0 0 24 24" fill="#fff"><path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3h-6z"/></svg>
  </div>
  <h1>Connect Apple Music</h1>
  <p id="lead">Sign in with your Apple ID to play your Apple Music library in the car.</p>

  <div id="codeView" hidden><div class="code" id="code"></div></div>
  <div id="entryView" hidden>
    <input id="codeInput" placeholder="CODE FROM CAR" autocomplete="off" autocapitalize="characters" maxlength="12">
  </div>

  <button id="go" disabled>Loading…</button>
  <div class="status" id="status" role="status"></div>
  <p class="fine">Your Apple ID password goes only to Apple. This page passes the resulting access token to
    your car once and then deletes it. Not affiliated with Apple.</p>
</main>

<script>
  // Supabase relay (see relay/supabase/functions/signin in the AAOSMusic repo).
  const RELAY = "https://tlrznrkphtyhuzvsjfis.supabase.co/functions/v1/signin";

  const $ = (id) => document.getElementById(id);
  const say = (text, cls = "") => { $("status").textContent = text; $("status").className = "status " + cls; };
  const clean = (c) => (c || "").toUpperCase().replace(/[^A-Z0-9]/g, "");
  const pretty = (c) => c.slice(0, 5) + "-" + c.slice(5);

  let code = clean(new URLSearchParams(location.search).get("c"));
  let musicKitReady = null;
  let submitted = false;

  function loadMusicKit() {
    return musicKitReady ??= new Promise((resolve, reject) => {
      document.addEventListener("musickitloaded", resolve, { once: true });
      const s = document.createElement("script");
      s.src = "https://js-cdn.music.apple.com/musickit/v3/musickit.js";
      s.async = true;
      s.onerror = () => reject(new Error("Couldn't load Apple's MusicKit"));
      document.head.appendChild(s);
    });
  }

  async function prepare() {
    $("go").disabled = true;
    $("go").textContent = "Loading…";
    say("");
    try {
      const r = await fetch(`${RELAY}/session/${encodeURIComponent(code)}`);
      const s = await r.json();
      if (!r.ok) throw new Error("This code has expired. Start sign-in again in the car.");
      if (s.status === "complete") { done(); return; }
      await loadMusicKit();
      const mk = await MusicKit.configure({ developerToken: s.developer_token, app: { name: "AAOSMusic", build: "1.0" } });
      // Apple may hand the token back via a reload/redirect or an event rather than resolving
      // authorize(); catch it whichever way it arrives.
      mk.addEventListener("authorizationStatusDidChange", () => {
        if (mk.isAuthorized && mk.musicUserToken) submit(mk.musicUserToken);
      });
      if (mk.isAuthorized && mk.musicUserToken) { submit(mk.musicUserToken); return; }
      $("codeView").hidden = false;
      $("entryView").hidden = true;
      $("code").textContent = pretty(code);
      $("lead").textContent = "Check this code matches the one on your car's screen, then sign in.";
      $("go").textContent = "Sign in with Apple Music";
      $("go").disabled = false;
      $("go").onclick = signIn;
    } catch (e) {
      say(e.message, "err");
      showEntry();
    }
  }

  async function signIn() {
    $("go").disabled = true;
    say("Waiting for Apple…");
    try {
      // Must run from the click so the browser allows Apple's sign-in popup.
      const userToken = await MusicKit.getInstance().authorize();
      if (!userToken) throw new Error("Sign-in was cancelled.");
      await submit(userToken);
    } catch (e) {
      say((e && e.message) || String(e) || "Sign-in failed. Try again.", "err");
      $("go").disabled = false;
    }
  }

  async function submit(userToken) {
    if (submitted) return;
    submitted = true;
    say("Sending to your car…");
    try {
      const r = await fetch(`${RELAY}/complete`, {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ code, music_user_token: userToken }),
      });
      if (!r.ok) throw new Error("This code has expired or was already used. Start sign-in again in the car.");
      done();
    } catch (e) {
      submitted = false;
      say(e.message, "err");
      $("go").disabled = false;
    }
  }

  function done() {
    $("go").hidden = true;
    $("codeView").hidden = true;
    $("entryView").hidden = true;
    $("lead").textContent = "";
    say("Done. Your car will finish connecting in a few seconds. You can close this page.", "ok");
  }

  function showEntry() {
    $("entryView").hidden = false;
    $("codeView").hidden = true;
    $("go").textContent = "Continue";
    $("go").disabled = false;
    $("go").onclick = () => {
      code = clean($("codeInput").value);
      if (code.length < 10) { say("Enter the 10-character code shown in the car.", "err"); return; }
      prepare();
    };
  }

  if (code) prepare(); else showEntry();
</script>
</body>
</html>
